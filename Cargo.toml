[workspace]
members = ["core"]
resolver = "2"

[package]
name = "partner"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Partner — encrypted single-file hierarchical notes for security auditors"
repository = "https://github.com/Nariod/Partner"
homepage = "https://github.com/Nariod/Partner"
keywords = ["notes", "encryption", "age", "security", "audit"]
categories = ["text-editors"]

[dependencies]
partner-core = { path = "core" }
eframe = "0.37"
arboard = "3.7"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
