[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = [
    # Transitive via age 0.12 -> p256 0.13 -> elliptic-curve -> crypto-bigint 0.5 (unpatched upstream;
    # the vulnerable constant-time ops are in the P-256 path, which Partner does not use: we only
    # exercise x25519 + scrypt + ChaCha20-Poly1305). Re-evaluate on every age upgrade.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
