[package]
name = "partner-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Core of Partner: document model, age encryption, storage, update metadata"
repository = "https://github.com/Nariod/Partner"

[dependencies]
age = { version = "0.12", features = ["armor"] }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
zstd = "0.13"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
getrandom = "0.4"
sha2 = "0.10"
serde_json = "1"
